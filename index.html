<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Finance</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>Olá, Tatiane 🌸</h1>
            <p>Floresça sua vida financeira</p>
        </header>

        <main>
            <section class="saldo">
                <span>Saldo disponível</span>
                <h2>R$ 0,00</h2>
            </section>

            <section class="cards">

                <div class="card">
                    <span>💰 Receitas</span>
                    <strong>R$ 0,00</strong>
                </div>

                <div class="card">
                    <span>💸 Despesas</span>
                    <strong>R$ 0,00</strong>
                </div>

            </section>

            <section class="sonhos">
                <h2>🎯 Meus Sonhos</h2>
                <p>Transforme seus objetivos em conquistas.</p>
            </section>

        </main>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
