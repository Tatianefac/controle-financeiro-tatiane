<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financista Tatiane</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topo">
        <h1>Olá, Tatiane 🌸</h1>
        <p>Vamos cuidar dos seus sonhos financeiros</p>
    </header>

    <section class="saldo">
        <span>Saldo disponível</span>
        <h2>R$ 0,00</h2>
    </section>

    <section class="resumo">

        <div class="card">
            <span>💰 Receitas</span>
            <strong>R$ 0,00</strong>
        </div>

        <div class="card">
            <span>💸 Despesas</span>
            <strong>R$ 0,00</strong>
        </div>

    </section>

    <section class="sonhos">
        <h2>🎯 Meus Sonhos</h2>
        <p>Organize suas metas e acompanhe suas conquistas.</p>

        <div class="meta">
            <span>Meu próximo objetivo</span>
            <strong>R$ 0,00</strong>
        </div>
    </section>

    <nav class="menu">

        <div>
            🏠
            <span>Início</span>
        </div>

        <div>
            💳
            <span>Lançamentos</span>
        </div>

        <div>
            🎯
            <span>Sonhos</span>
        </div>

        <div>
            📊
            <span>Relatórios</span>
        </div>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
