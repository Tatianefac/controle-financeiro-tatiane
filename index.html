<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financista Tatiane</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <section id="inicio">
        <header class="topo">
            <h1>Olá, Tatiane 🌸</h1>
            <p>Vamos cuidar dos seus sonhos financeiros</p>
        </header>

        <div class="saldo">
            <span>Saldo disponível</span>
            <h2 id="saldo">R$ 0,00</h2>
        </div>

        <div class="resumo">
            <div class="card">
                <span>💰 Receitas</span>
                <strong id="receitas">R$ 0,00</strong>
            </div>

            <div class="card">
                <span>💸 Despesas</span>
                <strong id="despesas">R$ 0,00</strong>
            </div>
        </div>
    </section>


    <section id="lancamentos" class="tela">
        <h2>💳 Lançamentos</h2>

        <button>+ Nova receita</button>
        <button>- Nova despesa</button>
    </section>


    <section id="sonhos" class="tela">
        <h2>🎯 Meus Sonhos</h2>

        <div class="meta">
            <p>Crie metas para realizar seus sonhos.</p>
        </div>
    </section>


    <section id="relatorios" class="tela">
        <h2>📊 Relatórios</h2>

        <p>Acompanhe sua evolução financeira.</p>
    </section>


    <nav class="menu">
        <div>🏠<span>Início</span></div>
        <div>💳<span>Lançamentos</span></div>
        <div>🎯<span>Sonhos</span></div>
        <div>📊<span>Relatórios</span></div>
    </nav>

</div>


<script src="script.js"></script>

</body>
</html>
